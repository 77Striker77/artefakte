<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>München — Reise-Cockpit</title>
<meta name="description" content="Karte von München mit Ankunftspunkt, Orientierungspunkten, Filmstudios und allen Bahnhaltestellen im Stadtgebiet.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:wght@400;600;700;800&family=Silkscreen&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="stil.css?v=26486480">
</head>
<body>

<!-- Die Menueleiste wird aus `menue` in bau/reise.json gebaut, nicht hier
     eingetragen: die Seite waechst, und ein Menue, das in der HTML-Datei steht,
     muss bei jedem neuen Punkt in JEDER Datei nachgezogen werden. -->
<header class="kopf">
  <div class="kopf-inner">
    <a class="marke" href="index.html" id="marke">München</a>
    <span class="eyebrow" id="eyebrow">Reiseziel · Deutschland</span>
    <nav class="menue" id="menue" aria-label="Hauptmenü"></nav>
  </div>
</header>

<main>
  <h1 class="titel" id="titel">München<em>erst die Stadt, dann die Tage</em></h1>

  <!-- Die Infobox steht ueber allen Ansichten, nicht in einer: sie ist das, was
       man beim Aufschlagen wissen will, und soll nicht verschwinden, wenn man
       einen anderen Menuepunkt oeffnet. Unbekanntes traegt "xx". -->
  <section class="infobox" aria-labelledby="infobox-titel">
    <h2 id="infobox-titel">Reisedaten</h2>
    <dl id="reisedaten"></dl>
    <p class="infobox-fuss" id="infobox-fuss"></p>
  </section>

  <section class="ansicht" id="feld-karte" aria-labelledby="menue-karte" tabindex="-1">
    <div id="karte" role="region" aria-label="Karte von München"></div>
    <ul class="legende" id="legende"></ul>
  </section>

  <section class="ansicht" id="feld-hotel" aria-labelledby="menue-hotel" tabindex="-1" hidden>
    <h2 class="ansicht-titel">Hotel</h2>
    <div id="hotel-tafel"></div>

    <!-- EINE Karte fuer beides. Das Untermenue schaltet den AUSSCHNITT -
         Umgebung oder ganzer Weg vom Hauptbahnhof -, die Legende darunter
         schaltet Kartenebenen. Zwei Steuerungen, jede fuer genau eine Sache.
         Zwei getrennte Karten standen hier am 09.09.2026 kurz untereinander und
         zeigten dieselbe Stadt zweimal; ein Ausschnitt ist kein Grund fuer eine
         zweite Karte, sondern ein Zustand derselben. -->
    <h3 class="tafel-titel">Wo es liegt und wie man hin- und zurückkommt</h3>
    <nav class="untermenue" id="weg-reiter" aria-label="Was die Karte zeigt"></nav>
    <div id="weg-tafel"></div>
    <div id="karte-hotel" role="region"
         aria-label="Karte der Unterkunft, ihrer Umgebung und der Wege vom und zum Hauptbahnhof"></div>
    <ul class="legende" id="legende-hotel"></ul>
    <!-- .grund-fuss, NICHT .tafel-fuss: dieser Fuss liegt auf dem dunklen Grund,
         nicht auf einer hellen Tafel, und braucht darum den anderen Rollensatz.
         Mit .tafel-fuss stand er bei 2,16:1. -->
    <p class="grund-fuss" id="umgebung-fuss"></p>
  </section>

  <!-- Innenstadt: die Karte ist der Inhalt, nicht die Illustration.
       KEINE Reisedaten-Infobox und keine Kennzahlentafel hier: dieser Reiter
       handelt von der Stadt, nicht von der Buchung. Beides stand am 09.09.2026
       darueber und schob die Karte unter die Falzkante - was oben steht, wird
       gelesen, und gelesen werden soll hier die Karte.

       ZWEI Steuerungen, jede fuer genau eine Sache: die LEGENDE unter der Karte
       schaltet Kartenebenen - alle sieben einzeln, keine davon nur Beschriftung.
       Das UNTERMENUE ueber der Liste waehlt, was in der Tabelle steht.

       Vorher schaltete das Untermenue beides, und die Legende war halb
       Beschriftung, halb Schalter. Dann weiss niemand, was ein Klick tut. Was
       nur die Tabelle betrifft - Wochenstreifen, Notenachse, Stufenskala -
       steht seither auch BEI der Tabelle und nicht in der Kartenlegende. -->
  <section class="ansicht" id="feld-innenstadt" aria-labelledby="menue-innenstadt" tabindex="-1" hidden>
    <h2 class="ansicht-titel">Innenstadt</h2>

    <div id="karte-innenstadt" role="region"
         aria-label="Karte der Münchner Innenstadt mit Lokalen, Wahrzeichen und Bahnhalten"></div>
    <ul class="legende" id="legende-innenstadt"></ul>
    <p class="grund-fuss" id="karte-fuss"></p>

    <!-- Zwei getrennte Steuerungen, und die Trennung ist der Punkt:
         die LEGENDE unter der Karte schaltet Kartenebenen, das UNTERMENUE
         waehlt, was in der Liste steht. Vorher schaltete das Untermenue beides
         und die Legende war halb Beschriftung, halb Schalter - dann weiss
         niemand, was ein Klick tut. -->
    <h3 class="tafel-titel">Die Liste</h3>
    <nav class="untermenue" id="innenstadt-reiter" aria-label="Was in der Liste steht"></nav>

    <!-- Der Lesesch luessel gehoert zur TABELLE, nicht zur Karte: Wochenstreifen,
         Notenachse und Stufenskala kommen auf der Karte gar nicht vor. -->
    <ul class="legende" id="listen-schluessel"></ul>

    <p class="such-leer" id="gastro-leer" hidden></p>

    <div id="gastro-liste"></div>
    <p class="grund-fuss" id="gastro-fuss"></p>
  </section>

  <!-- Bavaria: dieselbe Bauform wie der Hotel-Reiter - eine Tafel, darunter EINE
       Karte, deren Untermenue den Ausschnitt schaltet. Zwei Unterschiede:
       der Bezugspunkt des Wegs ist das Hotel und nicht der Hauptbahnhof, und
       die Varianten sind RICHTUNGEN - Hinweg und Rueckweg desselben Abends -
       statt Verkehrsmittel. Der Rueckweg ist hier keine Zugabe: die
       Aufzeichnung endet gegen 21 Uhr in Gruenwald.

       KEINE Reisedaten-Infobox: der Reiter handelt vom Ziel, nicht von der
       Buchung - derselbe Schalter wie bei 'Innenstadt' und 'Hotel'. -->
  <section class="ansicht" id="feld-bavaria" aria-labelledby="menue-bavaria" tabindex="-1" hidden>
    <h2 class="ansicht-titel">Bavaria Studios</h2>
    <div id="bavaria-tafel"></div>

    <h3 class="tafel-titel">Hin und zurück</h3>
    <nav class="untermenue" id="bavaria-reiter" aria-label="Was die Karte zeigt"></nav>
    <div id="bavaria-weg-tafel"></div>
    <div id="karte-bavaria" role="region"
         aria-label="Karte der Bavaria Studios mit dem Hin- und dem Rückweg zur Unterkunft"></div>
    <ul class="legende" id="legende-bavaria"></ul>
    <!-- .grund-fuss, NICHT .tafel-fuss - siehe die Begruendung am Hotel-Reiter. -->
    <p class="grund-fuss" id="bavaria-fuss"></p>
  </section>

  <!-- Bahn: ein Untermenue je Fahrt, plus 'Alternativen' fuer die ausgefallene
       Hinfahrt. Die Knoepfe stehen NICHT hier, sondern kommen aus reise.json -
       eine dritte Fahrt soll ein Datensatz sein und keine HTML-Aenderung.

       Das Streckenband statt einer Tabelle: eine Fahrt ist eine Folge, und eine
       Folge liest man als Linie. Zeiten links, Gleis rechts, Zwischenhalte
       leiser - so beantwortet ein Blick "wann bin ich wo", was eine Tabelle
       erst nach dem Lesen aller Zeilen kann. -->
  <section class="ansicht" id="feld-bahn" aria-labelledby="menue-bahn" tabindex="-1" hidden>
    <h2 class="ansicht-titel">Bahn</h2>
    <nav class="untermenue" id="bahn-reiter" aria-label="Welche Fahrt"></nav>
    <div id="bahn-tafel"></div>
  </section>

  <section class="ansicht" id="feld-quellen" aria-labelledby="menue-quellen" tabindex="-1" hidden>
    <h2 class="ansicht-titel">Quellen</h2>
    <div id="quellen-liste"></div>
  </section>
</main>

<script src="vendor/leaflet.js"></script>
<script src="orte.js?v=26486480"></script>
<script src="karte.js?v=26486480"></script>
</body>
</html>
