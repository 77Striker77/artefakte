<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rethymno — die Stadt nebenan</title>
<meta name="description" content="Rethymno auf echtem Kartenmaterial: venezianische Altstadt, Hafen und Fortezza, rund acht Kilometer vom Quartier.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:wght@400;600;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="stil.css">
<style>
  /* Zweite Ortsseite. Sie hat bewusst denselben Aufbau wie die Quartierseite -
     Kopf, Fakten, Karte, Ortsliste -, nur ist die Liste noch leer. Wenn hier
     Lokale dazukommen, wird in reise.json bei dieser Ortsseite "daten" auf den
     Schluessel in daten.js gesetzt; das Markup steht schon. */
  @media (max-width:640px){ #karte{height:clamp(320px,46vh,460px)} }
  #karte{height:clamp(380px,58vh,620px); border:var(--rand) solid var(--umriss);
         box-shadow:var(--schatten); background:var(--tiefe); z-index:0}
  .leaflet-container{font-family:var(--sans); background:var(--tiefe)}
  .leaflet-control-attribution{font-size:10.5px}

  .pixpin{display:flex; align-items:center; justify-content:center;
          width:30px; height:30px; image-rendering:pixelated}
  .pixpin svg{width:30px; height:30px; display:block; fill:currentColor;
              filter:drop-shadow(2px 0 0 var(--umriss)) drop-shadow(-2px 0 0 var(--umriss))
                     drop-shadow(0 2px 0 var(--umriss)) drop-shadow(0 -2px 0 var(--umriss))
                     drop-shadow(3px 3px 0 rgba(0,0,0,.32))}
  /* Eine Farbe je Art, wie auf der Quartierseite. Die Form traegt der Umriss,
     nicht die Fuellfarbe - dieselbe Mechanik, dieselbe drop-shadow-Kontur. */
  .k-altstadt{color:var(--koralle)}
  .k-festung{color:var(--p-baeckerei)}
  .k-museum{color:var(--p-cafe)}
  .k-kirche{color:var(--p-bar)}
  .k-hafen{color:var(--p-strandbar)}
  .k-strand{color:var(--p-strand)}
  .k-bau{color:var(--p-imbiss)}
  .k-hotel{color:var(--sonne-flaeche)}
  /* Kleiner als das Quartier-Sternchen: hier sind es 23 Punkte auf engem Raum. */
  .pixpin.klein{width:22px; height:22px}
  .pixpin.klein svg{width:22px; height:22px;
              filter:drop-shadow(2px 0 0 var(--umriss)) drop-shadow(-2px 0 0 var(--umriss))
                     drop-shadow(0 2px 0 var(--umriss)) drop-shadow(0 -2px 0 var(--umriss))
                     drop-shadow(2px 2px 0 rgba(0,0,0,.3))}

  .zeilenhuelle{display:flex; align-items:stretch; gap:var(--sp-2xs)}
  .zeilenhuelle .zeile{flex:1; min-width:0}
  .zeile{width:100%; text-align:left; font:inherit; cursor:pointer;
         background:var(--flaeche); color:var(--tinte);
         border:var(--rand) solid var(--umriss); padding:var(--sp-xs) var(--sp-s);
         display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--sp-s);
         align-items:center; min-height:44px}
  .zeile:hover{background:var(--flaeche-2)}
  .zname{font-weight:600; font-size:14px; line-height:1.25; display:block}
  .zmeta{font-size:12px; color:var(--tinte-leise); display:block; margin-top:1px}
  .zumaps{flex:none; display:flex; align-items:center; justify-content:center;
          padding:0 var(--sp-xs); min-width:44px;
          font-family:var(--zahl); font-size:10px; letter-spacing:.04em;
          text-decoration:none; color:var(--tinte); background:var(--flaeche);
          border:var(--rand) solid var(--umriss)}
  .zumaps:hover{background:var(--akzent-weich); color:var(--akzent-text)}
  .liste{list-style:none; margin:0; padding:0; display:grid; gap:var(--sp-2xs);
         grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
  .zaehler{font-family:var(--zahl); font-size:11px; color:var(--auf-tiefe-leise)}
  /* Der Hinweis zur Altstadt gehoert sichtbar an die Karte, nicht in die Fusszeile:
     ein gezeichneter Bereich, der keine amtliche Grenze ist, muss das sagen. */
  .altstadtkreis{stroke:var(--koralle); fill:var(--koralle); fill-opacity:.10;
                 stroke-dasharray:4 6; stroke-width:3}
  .kartenhinweis{background:var(--tiefe-tief); color:var(--auf-tiefe);
                 border-left:6px solid var(--koralle); padding:var(--sp-xs) var(--sp-m);
                 font-size:12.5px; margin-top:var(--sp-xs)}

  .faktenraster{display:grid; gap:var(--sp-xs); margin:var(--sp-m) 0;
                grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
  .fakt{background:var(--flaeche); color:var(--tinte);
        border:var(--rand) solid var(--umriss); box-shadow:var(--schatten-klein);
        padding:var(--sp-s) var(--sp-m)}
  .fakt dt{font-family:var(--zahl); font-size:10.5px; letter-spacing:.1em;
           text-transform:uppercase; color:var(--tinte-fein)}
  .fakt dd{margin:var(--sp-2xs) 0 0; font-size:14.5px}
  .charakter{margin-top:var(--sp-s); font-size:14px; color:var(--auf-tiefe-leise); max-width:64ch}
  .merkchips{display:flex; flex-wrap:wrap; gap:var(--sp-2xs); margin-top:var(--sp-s)}
  /* Diese Chips stehen frei auf dem Wasser, nicht in einer hellen Tafel wie auf
     der Uebersichtskarte. Ohne eigenen Grund erben sie --tinte und stehen dunkel
     auf dunkel: gemessen 1:1, also schlicht unsichtbar. */
  .merkchips .chip{background:var(--flaeche); color:var(--tinte)}

  .listenkopf{margin:var(--sp-xl) 0 var(--sp-s)}
  /* Der ehrliche Leerzustand. Eine leere Liste ohne Hinweis sieht aus wie ein
     Fehler; hier steht, dass die Orte noch nicht erfasst sind und was schon da ist. */
  .nochleer{background:var(--tiefe-tief); color:var(--auf-tiefe);
            border-left:6px solid var(--koralle); padding:var(--sp-m);
            font-size:13.5px}
  .nochleer strong{color:var(--koralle)}
  /* Der Kasten ist ein tiefes Panel - die globale a-Regel gaebe dem Link
     --akzent-text mit 2,75:1. */
  .nochleer a{color:var(--akzent-hell)}
  .nochleer p + p{margin-top:var(--sp-xs)}
  .karte-fuss{display:flex; flex-wrap:wrap; gap:var(--sp-xs) var(--sp-m);
              justify-content:space-between; margin:var(--sp-s) 0 var(--sp-xl);
              font-size:11px; color:var(--auf-tiefe-leise); font-family:var(--zahl)}
</style>
</head>
<body>
<a class="skip" href="#karte">Zur Karte springen</a>

<nav class="leiste">
  <div class="leiste-innen">
    <a class="marke" href="index.html">Kreta 2026</a>
    <div class="menue">
      <a href="index.html">Übersicht</a>
      <a href="karte.html">Vor Ort</a>
    </div>
    <details class="untermenue">
      <summary aria-label="Weitere Seiten">Mehr<span class="mpfeil" aria-hidden="true"></span></summary>
      <div class="untermenue-tafel">
        <a href="hotel.html">Das Hotel</a>
        <a href="rangfolge.html">Rangfolge</a>
      </div>
    </details>
  </div>
</nav>

<main class="huelle">
  <p class="eyebrow" id="tEyebrow">Vor Ort</p>
  <h1 id="tTitel">Rethymno</h1>
  <p class="unterzeile" id="tUnterzeile"></p>

  <dl class="faktenraster" id="fakten"></dl>
  <p class="charakter" id="charakter"></p>
  <div class="merkchips" id="merkmale"></div>

  <div class="wege" id="wege"></div>

  <div class="leiste2" id="artenLeiste"><span class="leiste-titel">Zeigen</span></div>

  <div id="karte"></div>
  <p class="kartenhinweis" id="kartenhinweis" hidden></p>
  <p class="karte-fuss"><span id="kartequelle"></span><span id="kartedetail"></span></p>

  <h2 class="listenkopf" id="orte">Sehenswertes im Einzelnen</h2>
  <div class="reiter" role="tablist" aria-label="Sehenswertes nach Art" id="listenreiter"></div>
  <div id="listentafeln"></div>
  <div id="ortsliste"></div>
</main>

<footer class="fuss"><div class="huelle" id="fuss"></div></footer>

<script src="vendor/leaflet.js"></script>
<script src="daten.js"></script>
<script src="gemein.js"></script>
<script>
(function () {
  "use strict";
  const D = window.DATEN || {};
  const $ = (id) => document.getElementById(id);
  const esc = window.esc;

  /* Alles Ortsabhaengige kommt aus reise.json, nichts steht hier fest
     verdrahtet - dieselbe Trennung wie auf den uebrigen Seiten. */
  const SEITE = (D.ortsseiten || []).find((o) => o.seite === "rethymno.html") || {};
  const STADT = (D.staedte || []).find((s) => s.name === SEITE.name) || null;
  const HOTEL = D.hotel || null;

  if (SEITE.titel) $("tTitel").textContent = SEITE.titel;
  if (SEITE.unterzeile) $("tUnterzeile").innerHTML = SEITE.unterzeile;
  $("tEyebrow").textContent = "Vor Ort · " + (SEITE.name || "Rethymno");

  /* ---------- Fakten ----------
     Sie liegen laengst in kreta-orte.json, weil die Uebersichtskarte sie fuer
     ihre Staedte-Reiter braucht. Diese Seite holt sie sich von dort, statt
     dieselben Zahlen ein zweites Mal zu pflegen. */
  if (STADT) {
    const zeile = (t, w) => "<div class='fakt'><dt>" + esc(t) + "</dt><dd>" + w + "</dd></div>";
    const weg = STADT.strasse_hotel_km === "unbekannt"
      ? "Entfernung unbekannt"
      : STADT.strasse_hotel_km + " km · rund " + STADT.fahrzeit_hotel_min + " min";
    $("fakten").innerHTML =
      zeile("Einwohner", STADT.einwohner === "unbekannt"
        ? "unbekannt"
        : STADT.einwohner.toLocaleString("de-DE") + " <small>(Zählung "
          + esc(STADT.einwohner_jahr) + ")</small>")
      + zeile("Ab dem Quartier", esc(weg))
      + zeile("Luftlinie", STADT.luftlinie_hotel_km + " km")
      + zeile("Griechisch", esc(STADT.name_gr));

    if (STADT.charakteristik && STADT.charakteristik !== "unbekannt")
      $("charakter").textContent = STADT.charakteristik;

    const NAMEN = { museen: ["Museum", "Museen"], festungen: ["Festung", "Festungen"],
      ausgrabungen: ["Ausgrabung", "Ausgrabungen"],
      faehranleger: ["Fähranleger", "Fähranleger"], marinas: ["Marina", "Marinas"] };
    $("merkmale").innerHTML = Object.entries(STADT.merkmale || {})
      .filter(([k, v]) => v > 0 && NAMEN[k])
      .sort((a, b) => b[1] - a[1])
      .map(([k, v]) => '<span class="chip">' + v + " " + NAMEN[k][v === 1 ? 0 : 1] + "</span>")
      .join("");

    $("wege").innerHTML =
      '<a href="https://www.google.com/maps/search/?api=1&query='
      + encodeURIComponent(SEITE.name + " " + (D.zielName || ""))
      + '" target="_blank" rel="noopener">In Google Maps</a>'
      + (HOTEL ? '<a href="https://www.google.com/maps/dir/?api=1&origin='
        + encodeURIComponent(HOTEL.name + ", " + (HOTEL.adresse || ""))
        + "&destination=" + encodeURIComponent(SEITE.name + " " + (D.zielName || ""))
        + '" target="_blank" rel="noopener">Route ab Quartier</a>' : "")
      + (STADT.wikipedia ? '<a href="' + esc(STADT.wikipedia)
        + '" target="_blank" rel="noopener">Wikipedia</a>' : "");
  }

  /* ---------- Karte ---------- */
  const karte = L.map("karte", { scrollWheelZoom: true })
    .setView([SEITE.lat || 35.36765, SEITE.lon || 24.47361], SEITE.zoom || 15);

  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende',
  }).addTo(karte);
  const satellit = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Luftbild: Esri, Maxar, Earthstar Geographics" });
  L.control.layers({ "Karte": osm, "Satellit": satellit }, null, { position: "topright" }).addTo(karte);
  L.control.scale({ imperial: false, position: "bottomleft" }).addTo(karte);

  /* Zwei Pixel-Symbole, dieselbe Schreibweise wie auf der Quartierseite: ein
     9x9-Raster je Zeile, daraus ein Sprite. shape-rendering="crispEdges" ist
     Pflicht - sonst zeichnet der Browser die Pixelkanten weich. */
  const SYMBOLE = {
    /* Altstadt: Haeuserzeile. */
    altstadt: [".........",
            "..X...X..",
            ".XXX.XXX.",
            ".X.X.X.X.",
            "XXXXXXXXX",
            "X.X.X.X.X",
            "XXXXXXXXX",
            "X.XX.XX.X",
            "XXXXXXXXX"],
    /* Festung & Tore: Zinnenkranz. */
    festung: [".........",
            "X.X.X.X.X",
            "XXXXXXXXX",
            "XXXXXXXXX",
            "X.XXXXX.X",
            "XXXXXXXXX",
            "XX.XXX.XX",
            "XXXXXXXXX",
            "XXXXXXXXX"],
    /* Museum: Giebel auf Saeulen. */
    museum: ["....X....",
            "..XXXXX..",
            ".XXXXXXX.",
            "XXXXXXXXX",
            ".........",
            ".X.X.X.X.",
            ".X.X.X.X.",
            ".X.X.X.X.",
            "XXXXXXXXX"],
    /* Kirche: Kreuz ueber dem Bau. */
    kirche: ["....X....",
            "...XXX...",
            "....X....",
            "..XXXXX..",
            ".XX...XX.",
            ".X.....X.",
            ".X.XXX.X.",
            ".X.XXX.X.",
            "XXXXXXXXX"],
    /* Hafen: Anker. */
    hafen: ["....X....",
            "...X.X...",
            "....X....",
            "..XXXXX..",
            "....X....",
            "X...X...X",
            "X...X...X",
            ".X..X..X.",
            "..XXXXX.."],
    /* Strand: Sonne ueber Welle - wie auf der Quartierseite. */
    strand: ["....X....",
            ".X..X..X.",
            "..XXXXX..",
            ".XXXXXXX.",
            "..XXXXX..",
            ".........",
            ".XX...XX.",
            "X..XX...X",
            "........."],
    /* Bauwerk: Loggia, Saeulen unter Gebaelk. */
    bau: [".........",
            "XXXXXXXXX",
            "XXXXXXXXX",
            ".X.X.X.X.",
            ".X.X.X.X.",
            ".X.X.X.X.",
            ".X.X.X.X.",
            "XXXXXXXXX",
            "XXXXXXXXX"],
    hotel: ["....X....",
            "...XXX...",
            "XXXXXXXXX",
            ".XXXXXXX.",
            "..XXXXX..",
            "..XX.XX..",
            ".XX...XX.",
            ".X.....X.",
            "........."],
  };
  (function sprite() {
    let inhalt = "";
    for (const [name, raster] of Object.entries(SYMBOLE)) {
      let rects = "";
      raster.forEach((zeile, y) => {
        let x = 0;
        while (x < zeile.length) {
          if (zeile[x] !== "X") { x++; continue; }
          let b = 0;
          while (zeile[x + b] === "X") b++;
          rects += `<rect x="${x}" y="${y}" width="${b}" height="1"/>`;
          x += b;
        }
      });
      inhalt += `<symbol id="sym-${name}" viewBox="0 0 9 9">${rects}</symbol>`;
    }
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("style", "position:absolute;width:0;height:0;overflow:hidden");
    svg.innerHTML = inhalt;
    document.body.prepend(svg);
  })();

  const symbolSvg = (sym) => SYMBOLE[sym]
    ? '<svg shape-rendering="crispEdges" aria-hidden="true"><use href="#sym-' + sym + '"/></svg>'
    : "";
  const marke = (klasse, sym, klein) => {
    const mass = klein ? 22 : 36;
    return L.divIcon({
      className: "",
      html: '<i class="pixpin ' + klasse + (klein ? " klein" : "") + '">'
        + symbolSvg(sym) + "</i>",
      iconSize: [mass, mass], iconAnchor: [mass / 2, mass / 2],
      popupAnchor: [0, -mass / 2],
    });
  };

  /* ---------- Sehenswertes ----------
     Die Punkte kommen aus ortsdetails.json - dieselbe Mechanik wie die Lokale
     auf der Quartierseite, nur eine Ebene weiter. */
  const DETAIL = (D.ortsdetails || {})[SEITE.id] || { punkte: [] };
  const ARTEN = (D.ortsdetailArten || []).filter(
    (a) => DETAIL.punkte.some((p) => p.art === a.id));
  const PUNKTE = DETAIL.punkte;

  const gruppen = {}, markerVon = new Map();
  const an = new Set(ARTEN.map((a) => a.id));

  const wegeLinks = (p) => {
    const suche = "https://www.google.com/maps/search/?api=1&query="
      + encodeURIComponent(p.name + " " + (SEITE.name || ""));
    return '<div class="pop-wege"><a href="' + suche
      + '" target="_blank" rel="noopener">In Google Maps</a>'
      + (HOTEL ? '<a href="https://www.google.com/maps/dir/?api=1&origin='
        + encodeURIComponent(HOTEL.name + ", " + (HOTEL.adresse || ""))
        + "&destination=" + encodeURIComponent(p.name + " " + (SEITE.name || ""))
        + '" target="_blank" rel="noopener">Route ab Quartier</a>' : "")
      + (p.wikipedia ? '<a href="' + esc(p.wikipedia)
        + '" target="_blank" rel="noopener">Wikipedia</a>' : "")
      + (p.web ? '<a href="' + esc(p.web)
        + '" target="_blank" rel="noopener">Website</a>' : "")
      + "</div>";
  };

  const titelVon = (id) => (ARTEN.find((a) => a.id === id) || {}).titel || id;

  ARTEN.forEach((a) => { gruppen[a.id] = L.layerGroup(); });
  PUNKTE.forEach((p, i) => {
    p.id = "p" + i;
    const m = L.marker([p.lat, p.lon], {
      icon: marke("k-" + p.art, p.art, p.art !== "altstadt"),
      zIndexOffset: p.art === "altstadt" ? 300 : 100,
    })
      .bindPopup('<span class="pop-art">' + esc(titelVon(p.art)) + "</span>"
        + '<span class="pop-name">' + esc(p.name) + "</span>"
        + (p.beschreibung ? '<span class="pop-zeile">' + esc(p.beschreibung) + "</span>" : "")
        + (p.zeiten ? '<span class="pop-zeile">Geöffnet: ' + esc(p.zeiten) + "</span>" : "")
        + wegeLinks(p), { maxWidth: 300 })
      .bindTooltip(p.name, { direction: "top", offset: [0, -12] });
    markerVon.set(p.id, m);
    if (gruppen[p.art]) gruppen[p.art].addLayer(m);
  });
  ARTEN.forEach((a) => gruppen[a.id].addTo(karte));

  /* Die Altstadt fuehrt OSM als PUNKT, nicht als Flaeche. Der Kreis ist darum
     ausdruecklich eine Orientierungshilfe und keine Grenze - und genau das
     steht auch unter der Karte. Eine gezeichnete Flaeche, die wie eine amtliche
     aussieht, waere hier die unehrlichere Loesung. */
  const altstadt = PUNKTE.find((p) => p.art === "altstadt");
  if (altstadt) {
    L.circle([altstadt.lat, altstadt.lon],
      { radius: 350, className: "altstadtkreis", interactive: false }).addTo(karte);
    const h = $("kartenhinweis");
    h.hidden = false;
    h.innerHTML = "<strong>Der Kreis um die Altstadt ist eine Orientierungshilfe, "
      + "keine Grenze.</strong> OpenStreetMap führt die Altstadt als Punkt, nicht als "
      + "Fläche — gezeichnet sind 350 m um diesen Punkt.";
  }

  /* ---------- Filterleiste ---------- */
  ARTEN.forEach((a) => {
    const n = PUNKTE.filter((p) => p.art === a.id).length;
    const b = document.createElement("button");
    b.className = "knopf"; b.type = "button";
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = '<span class="punkt marksym" style="color:var(--p-' + a.id + ')">'
      + symbolSvg(a.id) + "</span>" + esc(a.titel)
      + ' <span class="zahl">' + n + "</span>";
    b.addEventListener("click", () => {
      if (an.has(a.id)) { an.delete(a.id); karte.removeLayer(gruppen[a.id]); }
      else { an.add(a.id); gruppen[a.id].addTo(karte); }
      b.setAttribute("aria-pressed", String(an.has(a.id)));
      listeZeichnen();
    });
    $("artenLeiste").appendChild(b);
  });
  /* Das Quartier liegt ausserhalb dieses Ausschnitts, gehoert aber auf die
     Karte: es ist der Bezugspunkt, von dem aus man herkommt. */
  if (HOTEL && HOTEL.lat) {
    L.marker([HOTEL.lat, HOTEL.lon], { icon: marke("k-hotel", "hotel", false), zIndexOffset: 500 })
      .bindPopup('<span class="pop-art">Unser Hotel</span><span class="pop-name">'
        + esc(HOTEL.name) + '</span><div class="pop-wege">'
        + '<a href="hotel.html">Hotel im Detail</a>'
        + '<a href="karte.html">Karte vor Ort</a></div>')
      .addTo(karte);
  }

  $("kartequelle").textContent = "Karte: OpenStreetMap-Mitwirkende · Luftbild: Esri";
  $("kartedetail").textContent = SEITE.quelle || "";

  /* ---------- Liste in Reitern ----------
     Derselbe Aufbau wie auf der Quartierseite: eine Gruppe je Art, leere
     Gruppen fallen weg, und die Reiter werden bei jedem Filterwechsel neu
     gebaut - die Tastatur-Handler haengen darum an den neuen Knoepfen. */
  let reiterAktiv = 0;

  function reiterWaehlen(i, fokus) {
    const knoepfe = [...$("listenreiter").querySelectorAll('[role="tab"]')];
    if (!knoepfe.length) return;
    i = Math.max(0, Math.min(i, knoepfe.length - 1));
    reiterAktiv = i;
    knoepfe.forEach((b, k) => {
      const auf = k === i;
      b.setAttribute("aria-selected", auf ? "true" : "false");
      b.tabIndex = auf ? 0 : -1;
      const tafel = document.getElementById(b.getAttribute("aria-controls"));
      if (tafel) tafel.hidden = !auf;
      if (auf && fokus) b.focus();
    });
  }

  const zeileHtml = (p) =>
    '<li class="zeilenhuelle"><button class="zeile" type="button" data-id="' + p.id + '">'
    + '<span class="punkt marksym" style="color:var(--p-' + p.art + ')">'
    + symbolSvg(p.art) + "</span>"
    + '<span><span class="zname">' + esc(p.name) + "</span>"
    + (function () {
        // Keine Zweitzeile, die nur den Namen wiederholt ("Altstadt / Altstadt").
        const zweit = p.beschreibung || titelVon(p.art);
        return zweit && zweit !== p.name
          ? '<span class="zmeta">' + esc(zweit) + "</span>" : "";
      })() + "</span>"
    + "</button>"
    + '<a class="zumaps" href="https://www.google.com/maps/search/?api=1&query='
    + encodeURIComponent(p.name + " " + (SEITE.name || ""))
    + '" target="_blank" rel="noopener" aria-label="' + esc(p.name)
    + ' in Google Maps ansehen">Maps</a></li>';

  function listeZeichnen() {
    const sichtbar = PUNKTE.filter((p) => an.has(p.art));
    const proArt = {};
    for (const p of sichtbar) (proArt[p.art] ||= []).push(p);
    const zeigbar = ARTEN.filter((a) => (proArt[a.id] || []).length);

    $("listenreiter").innerHTML = zeigbar.map((a, i) =>
      '<button role="tab" type="button" id="rt-' + a.id + '" aria-controls="tp-' + a.id + '"'
      + ' aria-selected="' + (i === reiterAktiv ? "true" : "false") + '"'
      + (i === reiterAktiv ? "" : ' tabindex="-1"') + '>'
      + '<span class="punkt marksym" style="color:var(--p-' + a.id + ')">'
      + symbolSvg(a.id) + "</span>" + esc(a.titel)
      + ' <span class="zahl">' + proArt[a.id].length + "</span></button>").join("");

    $("listentafeln").innerHTML = zeigbar.map((a, i) =>
      '<div class="tafelinhalt" role="tabpanel" id="tp-' + a.id + '"'
      + ' aria-labelledby="rt-' + a.id + '" tabindex="0"'
      + (i === reiterAktiv ? "" : " hidden") + '>'
      + '<ul class="liste">' + proArt[a.id].map(zeileHtml).join("") + "</ul></div>").join("");

    [...$("listenreiter").querySelectorAll('[role="tab"]')].forEach((b, i) => {
      b.addEventListener("click", () => reiterWaehlen(i, false));
      b.addEventListener("keydown", (e) => {
        const n = zeigbar.length;
        if (e.key === "ArrowRight") { reiterWaehlen((i + 1) % n, true); e.preventDefault(); }
        else if (e.key === "ArrowLeft") { reiterWaehlen((i - 1 + n) % n, true); e.preventDefault(); }
        else if (e.key === "Home") { reiterWaehlen(0, true); e.preventDefault(); }
        else if (e.key === "End") { reiterWaehlen(n - 1, true); e.preventDefault(); }
      });
    });
    if (reiterAktiv >= zeigbar.length) reiterWaehlen(0, false);
  }

  /* Ein Klick in der Liste zeigt den Punkt auf der Karte. Der Handler haengt am
     bleibenden Behaelter - die Tafeln darin werden neu gebaut. */
  $("listentafeln").addEventListener("click", (e) => {
    const b = e.target.closest(".zeile");
    if (!b) return;
    const p = PUNKTE.find((x) => x.id === b.dataset.id);
    const m = markerVon.get(b.dataset.id);
    if (!p || !m) return;
    karte.setView([p.lat, p.lon], Math.max(karte.getZoom(), 16));
    m.openPopup();
    $("karte").scrollIntoView({ block: "nearest",
      behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });

  if (PUNKTE.length) listeZeichnen();

  if (!PUNKTE.length) {
    $("ortsliste").innerHTML =
      '<div class="nochleer"><p><strong>Hier ist noch nichts erfasst.</strong> '
      + "Für diesen Ort liegen noch keine Punkte vor.</p></div>";
  }

  /* Was hier NICHT steht, gehoert genannt: Lokale und Geschaefte sind fuer
     Rethymno nicht erhoben - auf der Quartierseite sind es 33 einzeln geprüfte. */
  if (PUNKTE.length) {
    const nachtrag = document.createElement("p");
    nachtrag.className = "nochleer";
    nachtrag.innerHTML = "<strong>Noch nicht erfasst:</strong> Lokale, Cafés und "
      + "Geschäfte in Rethymno. Was hier steht, sind Sehenswürdigkeiten aus "
      + "OpenStreetMap; die Gastronomie ist für diesen Ort noch nicht recherchiert. "
      + "Für den Quartierort sind es zum Vergleich 33 einzeln geprüfte Orte — "
      + "<a href='karte.html'>so sieht das dann aus</a>.";
    $("ortsliste").appendChild(nachtrag);
  }

  $("fuss").innerHTML =
    "<p>Kartenmaterial: &copy; OpenStreetMap-Mitwirkende (ODbL) · Luftbild: Esri, Maxar, "
    + "Earthstar Geographics.</p>"
    + "<p>Stadtdaten: " + esc(SEITE.quelle || "unbekannt") + ".</p>";
})();
</script>
</body>
</html>
