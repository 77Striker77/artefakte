<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kreta — Hotelvergleich</title>
<meta name="description" content="Karte von Kreta mit elf geprüften Strandhotels, nach Kriterien-Erfüllung gereiht.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Nunito:wght@400;600;700&family=Silkscreen&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="stil.css">
<style>
  #karte{height:clamp(360px,56vh,620px); border:var(--rand) solid var(--umriss);
         box-shadow:var(--schatten); background:var(--tiefe); z-index:0}
  /* Der Grund unter den Kacheln ist bei einer Kuestenkarte ohnehin Wasser. */
  .leaflet-container{font-family:var(--sans); background:var(--tiefe)}
  .leaflet-control-attribution{font-size:10.5px}

  /* Marken sind divIcons - normale HTML-Elemente, damit sie demselben Stylesheet
     gehorchen wie der Rest der Seite. display:flex ist Pflicht: <i> ist inline
     und wuerde width/height sonst ignorieren. */
  .pixpin{display:flex; align-items:center; justify-content:center;
          width:26px; height:26px; image-rendering:pixelated;
          font-family:var(--zahl); font-size:11px; color:var(--tinte);
          background:var(--flaeche);
          box-shadow:0 0 0 3px var(--umriss), 4px 4px 0 rgba(0,0,0,.3)}
  .pixpin.sieger{background:var(--sonne-flaeche)}
  .pixpin.aktiv{background:var(--akzent-weich);
                box-shadow:0 0 0 4px var(--akzent), 4px 4px 0 rgba(0,0,0,.3)}

  .leiste2{display:flex; flex-wrap:wrap; gap:var(--sp-xs); align-items:center;
           margin:var(--sp-l) 0 var(--sp-s)}
  .karte-fuss{display:flex; flex-wrap:wrap; gap:var(--sp-xs) var(--sp-m);
              justify-content:space-between; margin:var(--sp-s) 0 var(--sp-xl);
              font-size:11px; color:var(--auf-tiefe-leise); font-family:var(--zahl)}
  .listenkopf{display:flex; align-items:baseline; gap:var(--sp-s); margin-bottom:var(--sp-s)}
  .zaehler{font-family:var(--zahl); font-size:11px; color:var(--auf-tiefe-leise)}
  .liste{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--sp-xs)}
  .zeile{width:100%; text-align:left; font:inherit; cursor:pointer; background:var(--flaeche);
         color:var(--tinte);
         color:var(--tinte); border:var(--rand) solid var(--umriss);
         box-shadow:var(--schatten-klein); padding:var(--sp-s) var(--sp-m);
         display:grid; gap:var(--sp-2xs) var(--sp-m);
         grid-template-columns:2.4rem minmax(0,1fr) auto; align-items:center;
         transition:transform calc(.08s * var(--bewegung)) steps(2),
                    box-shadow calc(.08s * var(--bewegung)) steps(2)}
  .zeile:hover{background:var(--flaeche-2)}
  .zeile[aria-pressed="true"]{background:var(--akzent-weich);
                              transform:translate(3px,3px); box-shadow:0 0 0 var(--umriss)}
  /* "Gewaehlt" ist ein TIEFES Panel mit Goldrahmen, keine gelbe Flaeche.
     Flaechig gelb war der groesste Block der Seite und zog die Waerme zurueck,
     die dieser Umbau gerade herausgenommen hat - genau der Fehler, den der
     Kopf von stil.css ausschliesst: Sonne ist Punkt und Kante, nie Flaeche.
     Als einziges dunkles Panel zwischen hellen Tafeln sticht es staerker
     heraus als vorher. Rahmen 10,42:1 gegen den Grund, Titel 12,96:1. */
  .zeile.sieger{background:var(--tiefe-tief); color:var(--auf-tiefe);
                border-color:var(--sonne-flaeche)}
  .rang{font-family:var(--zahl); font-size:16px; color:var(--tinte-fein)}
  .zeile.sieger .rang{color:var(--sonne-flaeche)}
  .name{font-weight:700; font-size:15.5px; line-height:1.25}
  .ort{color:var(--tinte-leise); font-size:12.5px; margin-top:1px}
  .zeile.sieger .ort{color:var(--auf-tiefe-leise)}
  .werte{display:flex; align-items:center; gap:var(--sp-s); flex-wrap:wrap}
  .fit{font-family:var(--zahl); font-size:12px; min-width:3.6rem; text-align:right}
  .preis{font-family:var(--zahl); font-size:10px; color:var(--tinte-leise);
         min-width:8.5rem; text-align:right}
  .zeile.sieger .preis{color:var(--auf-tiefe)}
  .detail{grid-column:1 / -1; margin-top:var(--sp-xs); padding-top:var(--sp-xs);
          border-top:2px solid var(--umriss); font-size:13px; color:var(--tinte-leise); display:none}
  .zeile[aria-pressed="true"] .detail, .zeile.sieger .detail{display:block}
  .zeile.sieger .detail{color:var(--auf-tiefe-leise); border-top-color:var(--sonne-flaeche)}
  .sieger-hinweis{display:flex; flex-wrap:wrap; gap:var(--sp-s); align-items:center;
                  margin:var(--sp-m) 0 0; padding:var(--sp-s) var(--sp-m);
                  background:var(--tiefe-tief); border:var(--rand) solid var(--sonne-flaeche);
                  box-shadow:var(--schatten-klein); color:var(--auf-tiefe); font-size:14.5px}
  .sieger-hinweis strong{color:var(--sonne-flaeche)}
  .sieger-hinweis a{color:var(--akzent-hell)}

  /* Popup-Stile stehen jetzt zentral in stil.css - sie waren hier und in
     karte.html doppelt definiert und auseinandergelaufen. */

  @media (max-width:640px){
    .zeile{grid-template-columns:2rem minmax(0,1fr)}
    .werte{grid-column:1 / -1; justify-content:flex-start; margin-top:var(--sp-2xs)}
    .preis,.fit{text-align:left; min-width:0}
  }
</style>
</head>
<body>
<a class="skip" href="#liste">Zur Hotelliste springen</a>

<nav class="leiste">
  <div class="leiste-innen">
    <a class="marke" href="index.html">Kreta 2026</a>
    <div class="menue">
      <a href="index.html">Übersicht</a>
      <a href="hotel.html">Das Hotel</a>
      <a href="karte.html">Vor Ort</a>
    </div>
  </div>
</nav>

<main class="huelle">
  <p class="eyebrow">Hotelvergleich · Shortlist</p>
  <h1>Kreta, <em>elf Kandidaten</em></h1>
  <p class="unterzeile">Alle geprüften Strandhotels der Shortlist, verortet und in der
    Reihenfolge der Kriterien-Erfüllung. Ein Klick auf eine Zeile springt zum Hotel
    auf der Karte.</p>

  <p class="sieger-hinweis" id="siegerHinweis"></p>

  <div class="leiste2">
    <button class="knopf" type="button" id="zAlles">Ganz Kreta</button>
    <button class="knopf haupt" type="button" id="zSieger">Zum gewählten Hotel</button>
  </div>

  <div id="karte"></div>
  <p class="karte-fuss"><span id="kartequelle"></span><span id="kartedetail"></span></p>

  <div class="listenkopf">
    <h2 id="liste">Die Rangfolge</h2>
    <span class="zaehler" id="zaehler"></span>
  </div>
  <ul class="liste" id="listeninhalt"></ul>
</main>

<footer class="fuss"><div class="huelle" id="fuss"></div></footer>

<script src="vendor/leaflet.js"></script>
<script src="daten.js"></script>
<script src="gemein.js"></script>
<script>
(function () {
  "use strict";
  const D = window.DATEN;
  const $ = (id) => document.getElementById(id);
  const esc = window.esc, reich = window.reich;

  /* ---------- Karte ---------- */
  const karte = L.map("karte", { scrollWheelZoom: true });

  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-Mitwirkende',
  }).addTo(karte);
  const satellit = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19, attribution: "Luftbild: Esri, Maxar, Earthstar Geographics" });
  L.control.layers({ "Karte": osm, "Satellit": satellit }, null, { position: "topright" }).addTo(karte);
  L.control.scale({ imperial: false, position: "bottomleft" }).addTo(karte);

  const marke = (h, aktiv) => L.divIcon({
    className: "",
    html: '<i class="pixpin' + (h.rang === 1 ? " sieger" : "") + (aktiv ? " aktiv" : "")
        + '">' + h.rang + "</i>",
    iconSize: [26, 26], iconAnchor: [13, 13], popupAnchor: [0, -15],
  });

  function popup(h) {
    const ziel = h.lat + "," + h.lon;
    return '<span class="pop-rang">Rang ' + h.rang + (h.rang === 1 ? " · gewählt" : "") + "</span>"
      + '<span class="pop-name">' + esc(h.name) + "</span>"
      + '<span class="pop-zeile">' + esc(h.lage) + "</span>"
      + '<span class="pop-zeile">' + h.zimmer + " Zimmer · " + esc(h.niveau) + " · "
      + (h.adults ? "Adults Only" : "kein Adults Only") + "</span>"
      + '<span class="pop-zeile">' + esc(h.bewertung) + "</span>"
      + '<span class="pop-zeile">'
      + (h.preis && h.preis.startsWith("unbekannt") ? "Preis unbekannt" : esc(h.preis))
      + " · " + esc(h.budget) + "</span>"
      + '<div class="pop-wege">'
      + (h.rang === 1 ? '<a class="haupt" href="hotel.html">Hotel im Detail</a>' : "")
      + '<a href="https://www.google.com/maps/search/?api=1&query=' + ziel
      + '" target="_blank" rel="noopener">In Google Maps</a></div>';
  }

  const markerVon = new Map();
  D.hotels.forEach((h) => {
    const m = L.marker([h.lat, h.lon], { icon: marke(h, false),
                                         zIndexOffset: h.rang === 1 ? 500 : 0 })
      .bindPopup(() => popup(h), { maxWidth: 300 })
      .bindTooltip(h.rang + ". " + h.name, { direction: "top", offset: [0, -12] })
      .addTo(karte);
    m.on("click", () => setzen(h.rang, false));
    markerVon.set(h.rang, m);
  });

  const alleBounds = L.latLngBounds(D.hotels.map((h) => [h.lat, h.lon]));
  karte.fitBounds(alleBounds, { padding: [40, 40] });

  $("zAlles").addEventListener("click", () => karte.fitBounds(alleBounds, { padding: [40, 40] }));
  $("zSieger").addEventListener("click", () => {
    const s = D.hotels[0];
    karte.setView([s.lat, s.lon], 13);
    markerVon.get(1).openPopup();
  });

  $("kartequelle").textContent = "Karte: OpenStreetMap-Mitwirkende · Luftbild: Esri";
  $("kartedetail").textContent = "Hotelkoordinaten: Google Places, 2026-08-21";

  /* ---------- Liste ---------- */
  const chipKlasse = (b) => (b === "passt" ? "passt" : b === "KO" ? "ko" : "grenz");
  const sieger = D.hotels[0];
  $("siegerHinweis").innerHTML = "<strong>Gewählt: " + esc(sieger.name) + "</strong> · "
    + esc(sieger.lage) + ' — <a href="hotel.html">Hotel im Detail</a> · '
    + '<a href="karte.html">Karte vor Ort</a>';
  $("zaehler").textContent = D.hotels.length + " Hotels · Stand " + D.stand;

  $("listeninhalt").innerHTML = D.hotels.map((h) => `
    <li>
      <button class="zeile${h.rang === 1 ? " sieger" : ""}" type="button"
              aria-pressed="false" data-rang="${h.rang}">
        <span class="rang">${h.rang}</span>
        <span>
          <span class="name">${esc(h.name)}</span>
          <span class="ort">${esc(h.lage)}</span>
        </span>
        <span class="werte">
          <span class="fit">${h.fit == null ? "–" : h.fit + " %"}</span>
          <span class="preis">${h.preis && h.preis.startsWith("unbekannt") ? "unbekannt" : esc(h.preis)}</span>
          <span class="chip ${chipKlasse(h.budget)}">${esc(h.budget)}</span>
        </span>
        <span class="detail">
          ${h.titel ? reich(h.titel) + " · " : ""}${h.zimmer} Zimmer · ${esc(h.niveau)} ·
          ${h.adults ? "Adults Only" : "kein Adults Only"} · Bewertung ${reich(h.bewertung)}
          <br>Strand: ${reich(h.strand)}
        </span>
      </button>
    </li>`).join("");

  let aktiv = null;
  function setzen(rang, springen) {
    if (aktiv !== null) {
      markerVon.get(aktiv).setIcon(marke(D.hotels[aktiv - 1], false));
      document.querySelector('.zeile[data-rang="' + aktiv + '"]')?.setAttribute("aria-pressed", "false");
    }
    aktiv = rang === aktiv ? null : rang;
    if (aktiv === null) return;
    const h = D.hotels[aktiv - 1];
    const m = markerVon.get(aktiv);
    m.setIcon(marke(h, true));
    document.querySelector('.zeile[data-rang="' + aktiv + '"]')?.setAttribute("aria-pressed", "true");
    if (springen) {
      karte.setView([h.lat, h.lon], Math.max(karte.getZoom(), 11));
      m.openPopup();
      $("karte").scrollIntoView({ block: "nearest",
        behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  }
  $("listeninhalt").addEventListener("click", (e) => {
    const b = e.target.closest(".zeile");
    if (b) setzen(Number(b.dataset.rang), true);
  });

  $("fuss").innerHTML =
    "<p>Quelle aller Hotelangaben: eigene Recherche, Stand " + D.stand
    + ". Preise sind Schätzwerte für die Hochsaison; wo kein Wert abrufbar war, steht "
    + "<em>unbekannt</em> statt einer Schätzung.</p>"
    + "<p>Kartenmaterial: &copy; OpenStreetMap-Mitwirkende (ODbL) · Luftbild: Esri, Maxar, "
    + "Earthstar Geographics. Hotelkoordinaten: Google Places API, abgerufen 2026-08-21.</p>";
})();
</script>
</body>
</html>
